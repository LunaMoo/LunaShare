name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev libasound2-dev libpulse-dev
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"; fi
          if [ "$RUNNER_OS" == "Windows" ]; then EXTRA="-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          if [ -f build/Release/lunashare_tests.exe ]; then build/Release/lunashare_tests.exe; else build/lunashare_tests; fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" == "Windows" ]; then cp build/Release/LunaShare.exe dist/;
          elif [ "$RUNNER_OS" == "macOS" ]; then cp -R build/LunaShare.app dist/;
          else cp build/LunaShare dist/; fi
          cp README.md LICENSE dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-${{ matrix.name }}
          path: dist

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install NDK / CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-android
          path: android/app/build/outputs/apk/release/*.apk
