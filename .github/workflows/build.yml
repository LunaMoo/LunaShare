name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Trimmed FFmpeg (LGPL) shared by the Windows video and player modules, loaded at run time from modules/:
  # video decoders (+ D3D11VA GPU decoding), the common containers and audio decoders. Cached; rebuilt on changes.
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffwin
          key: ffmpeg-n7.1-win64-player-v2
      - name: Build FFmpeg (mingw-w64 cross)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 nasm
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffsrc
          mkdir ffbuild && cd ffbuild
          ../ffsrc/configure --prefix=$GITHUB_WORKSPACE/ffwin --target-os=mingw32 --arch=x86_64 --cross-prefix=x86_64-w64-mingw32- \
            --disable-everything --disable-programs --disable-doc --disable-avdevice --disable-swscale \
            --disable-avfilter --disable-network --disable-autodetect --enable-w32threads --enable-d3d11va \
            --enable-avformat --enable-protocol=file --enable-demuxer=mov,matroska,ogg,mp3,flac,wav,aac,avi \
            --enable-decoder=h264,hevc,av1,vp8,vp9,mpeg4,aac,mp3,mp3float,opus,vorbis,flac,alac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8 \
            --enable-parser=h264,hevc,av1,vp8,vp9,mpeg4video,aac,mpegaudio,opus,vorbis,flac \
            --enable-hwaccel=h264_d3d11va,h264_d3d11va2,hevc_d3d11va,hevc_d3d11va2,av1_d3d11va,av1_d3d11va2,vp9_d3d11va,vp9_d3d11va2 \
            --enable-shared --disable-static --disable-debug --extra-ldflags=-static-libgcc
          make -j4 && make install
          cp ../ffsrc/COPYING.LGPLv2.1 $GITHUB_WORKSPACE/ffwin/FFmpeg-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffwin

  # FFmpeg 7.1 for Linux: shared libraries for modules/ (player + video), with x264 (H.264 encoding, GPL) and dav1d
  # (AV1 decoding). Libraries find each other through RUNPATH=$ORIGIN.
  ffmpeg-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: fflin
          key: ffmpeg-n7.1-linux-x264-dav1d-gpu-v2
      - name: Build x264, dav1d and FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y nasm meson ninja-build patchelf libdrm-dev
          W=$GITHUB_WORKSPACE
          # NVIDIA NVENC/NVDEC: headers only, FFmpeg loads the driver's libraries when they exist
          git clone --depth 1 --branch n12.2.72.0 https://github.com/FFmpeg/nv-codec-headers.git nvh
          (cd nvh && make PREFIX=$W/deps install)
          # VA-API (Intel / AMD): libva is bundled (DRM only), the system's driver is used; the driver path covers the usual
          # distribution layouts (LIBVA_DRIVERS_PATH still overrides it)
          git clone --depth 1 --branch 2.22.0 https://github.com/intel/libva.git libvasrc
          (cd libvasrc && meson setup build --prefix=$W/deps --libdir=lib -Dwith_x11=no -Dwith_wayland=no -Dwith_glx=no \
             -Ddriverdir=/usr/lib/x86_64-linux-gnu/dri:/usr/lib64/dri:/usr/lib/dri:/usr/local/lib/dri --buildtype=release && ninja -C build install)
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264src || git clone --depth 1 https://github.com/mirror/x264 x264src
          (cd x264src && ./configure --prefix=$W/deps --enable-static --enable-pic --disable-cli --bit-depth=8 && make -j4 && make install)
          git clone --depth 1 --branch 1.5.1 https://github.com/videolan/dav1d.git dav1dsrc
          (cd dav1dsrc && meson setup build --prefix=$W/deps --libdir=lib --default-library=static -Denable_tools=false -Denable_tests=false \
             -Db_staticpic=true --buildtype=release && ninja -C build install)
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffsrc
          mkdir ffbuild && cd ffbuild
          PKG_CONFIG_PATH=$W/deps/lib/pkgconfig ../ffsrc/configure --prefix=$W/fflin \
            --disable-everything --disable-programs --disable-doc --disable-avdevice --disable-swscale --disable-avfilter \
            --disable-postproc --disable-network --disable-autodetect --enable-gpl --enable-libx264 --enable-libdav1d --enable-pthreads \
            --enable-ffnvcodec --enable-nvenc --enable-nvdec --enable-vaapi \
            --enable-avformat --enable-protocol=file --enable-demuxer=mov,matroska,ogg,mp3,flac,wav,aac,avi \
            --enable-decoder=h264,hevc,av1,libdav1d,vp8,vp9,mpeg4,mjpeg,aac,mp3,mp3float,opus,vorbis,flac,alac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8 \
            --enable-encoder=libx264,h264_nvenc,h264_vaapi \
            --enable-hwaccel=h264_vaapi,hevc_vaapi,av1_vaapi,vp9_vaapi,h264_nvdec,hevc_nvdec,av1_nvdec,vp9_nvdec \
            --enable-parser=h264,hevc,av1,vp8,vp9,mpeg4video,aac,mpegaudio,opus,vorbis,flac,mjpeg \
            --enable-shared --disable-static --disable-debug --extra-ldflags=-Wl,-Bsymbolic
          make -j4 && make install
          cp -L $W/deps/lib/libva.so.2 $W/deps/lib/libva-drm.so.2 $W/fflin/lib/
          for f in $W/fflin/lib/lib*.so.*; do [ -L "$f" ] || patchelf --set-rpath '$ORIGIN' "$f"; done
          readelf -d $W/fflin/lib/libavutil.so.59 | grep -E "NEEDED|RUNPATH"
          cp $W/libvasrc/COPYING $W/fflin/libva-LICENSE.txt
          cp ../ffsrc/COPYING.GPLv2 $W/fflin/FFmpeg-LICENSE.txt
          cp $W/x264src/COPYING $W/fflin/x264-LICENSE.txt
          cp $W/dav1dsrc/COPYING $W/fflin/dav1d-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: fflin

  desktop:
    needs: [ffmpeg-windows, ffmpeg-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-win64
          path: ffwin
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ffmpeg-linux
          path: fflin
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev libasound2-dev libpulse-dev libfreetype-dev
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"; fi
          if [ "$RUNNER_OS" == "Windows" ]; then EXTRA="-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DLUNASHARE_FFMPEG_DIR=$(cygpath -m "$PWD")/ffwin"; fi
          if [ "$RUNNER_OS" == "Linux" ]; then EXTRA="-DLUNASHARE_FFMPEG_DIR=$PWD/fflin"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then python3 tools/i18n_keys.py src/app/lang/pl.inc; fi
          if [ -f build/Release/lunashare_tests.exe ]; then build/Release/lunashare_voice_tests.exe && build/Release/lunashare_video_tests.exe && build/Release/lunashare_tests.exe; else build/lunashare_voice_tests && build/lunashare_video_tests && build/lunashare_tests; fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          # the optional calls module goes into modules/ (delete that folder for a chat + files only install)
          mkdir -p dist/modules
          if [ "$RUNNER_OS" == "Windows" ]; then cp build/Release/LunaShare.exe build/Release/lunashare-rendezvous.exe dist/; cp build/Release/lunashare_media.dll build/Release/lunashare_video.dll build/Release/lunashare_vcam.dll dist/modules/; cp build/Release/lunashare_player.dll build/Release/lunashare_emoji.dll dist/modules/; cp ffwin/bin/avcodec-61.dll ffwin/bin/avutil-59.dll ffwin/bin/avformat-61.dll ffwin/bin/swresample-5.dll ffwin/FFmpeg-LICENSE.txt dist/modules/;
          elif [ "$RUNNER_OS" == "macOS" ]; then cp -R build/LunaShare.app build/lunashare-rendezvous dist/; cp build/liblunashare_media.dylib dist/LunaShare.app/Contents/MacOS/; rmdir dist/modules;
          else cp build/LunaShare build/lunashare-rendezvous server/lunashare-rendezvous.service dist/; cp build/liblunashare_media.so build/liblunashare_emoji.so build/liblunashare_video.so build/liblunashare_player.so dist/modules/; cp -L fflin/lib/libavcodec.so.61 fflin/lib/libavutil.so.59 fflin/lib/libavformat.so.61 fflin/lib/libswresample.so.5 fflin/lib/libva.so.2 fflin/lib/libva-drm.so.2 dist/modules/; cp fflin/*-LICENSE.txt dist/modules/; fi
          cp README.md LICENSE dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-${{ matrix.name }}
          path: dist

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install NDK / CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"
      - name: Build APK
        working-directory: android
        run: gradle assembleLiteRelease assembleCallsRelease --no-daemon
      - name: Check modules in the APKs
        run: |
          calls=$(ls android/app/build/outputs/apk/calls/release/*.apk); lite=$(ls android/app/build/outputs/apk/lite/release/*.apk)
          unzip -l "$calls" | grep -E "lib(lunashare_media|lunashare_video)\.so" | head
          unzip -l "$calls" | grep -q "arm64-v8a/liblunashare_video.so" || { echo "video module missing from calls APK"; exit 1; }
          unzip -l "$calls" | grep -q "arm64-v8a/liblunashare_media.so" || { echo "voice module missing from calls APK"; exit 1; }
          for a in "$calls" "$lite"; do unzip -l "$a" | grep -q "arm64-v8a/liblunashare_player.so" || { echo "player module missing from $a"; exit 1; }; done
          for a in "$calls" "$lite"; do unzip -l "$a" | grep -q "arm64-v8a/liblunashare_emoji.so" || { echo "emoji module missing from $a"; exit 1; }; done
          if unzip -l "$lite" | grep -qE "lunashare_(media|video)"; then echo "lite APK must not contain call modules"; exit 1; fi
          unzip -p "$calls" 'classes*.dex' | grep -aq "Lorg/lunamoo/lunashare/VideoEngine;" || { echo "VideoEngine missing from calls APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-android
          path: android/app/build/outputs/apk/*/release/*.apk

  opnsense:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build rendezvous server on FreeBSD (OPNsense base)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y cmake git
          run: |
            set -e
            cmake -S . -B build-bsd -DCMAKE_BUILD_TYPE=Release -DLUNASHARE_BUILD_APP=OFF -DLUNASHARE_BUILD_TESTS=OFF -DCMAKE_EXE_LINKER_FLAGS=-static
            cmake --build build-bsd --target lunashare-rendezvous -j 3
            ./build-bsd/lunashare-rendezvous --hash-room test test
            ./build-bsd/lunashare-rendezvous -p 47999 & PID=$!; sleep 2; kill $PID
            mkdir -p dist/lunashare-opnsense/bin
            cp build-bsd/lunashare-rendezvous dist/lunashare-opnsense/bin/
            cp -R opnsense/src opnsense/install.sh docs/INTERNET.md dist/lunashare-opnsense/
            tar -C dist -czf lunashare-opnsense.tar.gz lunashare-opnsense
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-opnsense-freebsd-amd64
          path: lunashare-opnsense.tar.gz

  # Every push to main refreshes the "latest" pre-release, so files have stable public download links
  # (Actions artifacts need a GitHub login, which e.g. an OPNsense box doesn't have).
  # main: the rolling "latest" pre-release. A tag vX.Y.Z: a real release named after it, notes from CHANGELOG.md.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [desktop, android, opnsense]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          tag=""
          case "$GITHUB_REF" in refs/tags/v*) tag=${GITHUB_REF#refs/tags/};; esac
          ver=${tag#v}
          suffix=${ver:+-$ver}
          cp art/LunaShare-opnsense-freebsd-amd64/lunashare-opnsense.tar.gz out/
          for a in $(find art/LunaShare-android -name '*.apk'); do
            b=$(basename "$a" .apk)
            if [ -n "$tag" ]; then cp "$a" "out/LunaShare$suffix-${b#app-}.apk"; else cp "$a" out/; fi
          done
          for d in windows-x64 linux-x64 macos-arm64; do (cd art/LunaShare-$d && zip -qry ../../out/LunaShare$suffix-$d.zip .); done
          ls -l out
          if [ -n "$tag" ]; then
            # notes: this version's section of CHANGELOG.md
            awk -v v="## $ver" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' src/CHANGELOG.md > notes.md
            cat notes.md
            gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "LunaShare $ver" --notes-file notes.md --verify-tag
            gh release upload "$tag" out/* -R "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          git_sha=${GITHUB_SHA::7}
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --prerelease --title "Latest build" --notes "Automatic build of main."
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true || true
          gh release edit latest -R "$GITHUB_REPOSITORY" --notes "Automatic build of main ($git_sha)."
          gh release upload latest out/* -R "$GITHUB_REPOSITORY" --clobber
