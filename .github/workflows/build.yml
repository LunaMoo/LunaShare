name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev libasound2-dev libpulse-dev
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"; fi
          if [ "$RUNNER_OS" == "Windows" ]; then EXTRA="-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          if [ -f build/Release/lunashare_tests.exe ]; then build/Release/lunashare_voice_tests.exe && build/Release/lunashare_video_tests.exe && build/Release/lunashare_tests.exe; else build/lunashare_voice_tests && build/lunashare_video_tests && build/lunashare_tests; fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          # the optional calls module goes into modules/ (delete that folder for a chat + files only install)
          mkdir -p dist/modules
          if [ "$RUNNER_OS" == "Windows" ]; then cp build/Release/LunaShare.exe build/Release/lunashare-rendezvous.exe dist/; cp build/Release/lunashare_media.dll build/Release/lunashare_video.dll dist/modules/;
          elif [ "$RUNNER_OS" == "macOS" ]; then cp -R build/LunaShare.app build/lunashare-rendezvous dist/; cp build/liblunashare_media.dylib dist/LunaShare.app/Contents/MacOS/; rmdir dist/modules;
          else cp build/LunaShare build/lunashare-rendezvous server/lunashare-rendezvous.service dist/; cp build/liblunashare_media.so dist/modules/; fi
          cp README.md LICENSE dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-${{ matrix.name }}
          path: dist

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install NDK / CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"
      - name: Build APK
        working-directory: android
        run: gradle assembleLiteRelease assembleCallsRelease --no-daemon
      - name: Check modules in the APKs
        run: |
          calls=$(ls android/app/build/outputs/apk/calls/release/*.apk); lite=$(ls android/app/build/outputs/apk/lite/release/*.apk)
          unzip -l "$calls" | grep -E "lib(lunashare_media|lunashare_video)\.so" | head
          unzip -l "$calls" | grep -q "arm64-v8a/liblunashare_video.so" || { echo "video module missing from calls APK"; exit 1; }
          unzip -l "$calls" | grep -q "arm64-v8a/liblunashare_media.so" || { echo "voice module missing from calls APK"; exit 1; }
          if unzip -l "$lite" | grep -qE "lunashare_(media|video)"; then echo "lite APK must not contain call modules"; exit 1; fi
          unzip -p "$calls" 'classes*.dex' | grep -aq "Lorg/lunamoo/lunashare/VideoEngine;" || { echo "VideoEngine missing from calls APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-android
          path: android/app/build/outputs/apk/*/release/*.apk

  opnsense:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build rendezvous server on FreeBSD (OPNsense base)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y cmake git
          run: |
            set -e
            cmake -S . -B build-bsd -DCMAKE_BUILD_TYPE=Release -DLUNASHARE_BUILD_APP=OFF -DLUNASHARE_BUILD_TESTS=OFF -DCMAKE_EXE_LINKER_FLAGS=-static
            cmake --build build-bsd --target lunashare-rendezvous -j 3
            ./build-bsd/lunashare-rendezvous --hash-room test test
            ./build-bsd/lunashare-rendezvous -p 47999 & PID=$!; sleep 2; kill $PID
            mkdir -p dist/lunashare-opnsense/bin
            cp build-bsd/lunashare-rendezvous dist/lunashare-opnsense/bin/
            cp -R opnsense/src opnsense/install.sh docs/INTERNET.md dist/lunashare-opnsense/
            tar -C dist -czf lunashare-opnsense.tar.gz lunashare-opnsense
      - uses: actions/upload-artifact@v4
        with:
          name: LunaShare-opnsense-freebsd-amd64
          path: lunashare-opnsense.tar.gz

  # Every push to main refreshes the "latest" pre-release, so files have stable public download links
  # (Actions artifacts need a GitHub login, which e.g. an OPNsense box doesn't have).
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop, android, opnsense]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp art/LunaShare-opnsense-freebsd-amd64/lunashare-opnsense.tar.gz out/
          find art/LunaShare-android -name '*.apk' -exec cp {} out/ \;
          for d in windows-x64 linux-x64 macos-arm64; do (cd art/LunaShare-$d && zip -qry ../../out/LunaShare-$d.zip .); done
          ls -l out
          git_sha=${GITHUB_SHA::7}
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --prerelease --title "Latest build" --notes "Automatic build of main."
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true || true
          gh release edit latest -R "$GITHUB_REPOSITORY" --notes "Automatic build of main ($git_sha)."
          gh release upload latest out/* -R "$GITHUB_REPOSITORY" --clobber
