plugins {
    id 'com.android.application'
}

// SDL2's Java glue (org.libsdl.app.*) must match the native SDL version that CMake fetches.
def sdlTag = 'release-2.32.8'
def sdlDir = file("${rootDir}/sdl")

tasks.register('fetchSdlJava') {
    onlyIf { !file("${sdlDir}/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java").exists() }
    doLast {
        exec { commandLine 'git', 'clone', '--depth', '1', '-b', sdlTag, 'https://github.com/libsdl-org/SDL.git', sdlDir.absolutePath }
    }
}
preBuild.dependsOn 'fetchSdlJava'

android {
    namespace 'org.lunamoo.lunashare'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.lunamoo.lunashare'
        minSdk 24          // getifaddrs() + modern Wi-Fi APIs
        targetSdk 35
        versionCode 164   // major * 100 + minor * 10 + patch
        versionName '1.6.4'
        manifestPlaceholders = [appLabel: 'LunaShare']
        externalNativeBuild {
            cmake {
                // one app with everything (voice + video calls); build your own without them with -DLUNASHARE_BUILD_VOICE=OFF / VIDEO=OFF
                arguments '-DANDROID_STL=c++_shared', '-DLUNASHARE_BUILD_TESTS=OFF', '-DLUNASHARE_BUILD_VOICE=ON', '-DLUNASHARE_BUILD_VIDEO=ON',
                          "-DFETCHCONTENT_SOURCE_DIR_SDL2=${sdlDir.absolutePath}",
                          // FFmpeg for sound tracks and subtitles the phone can't decode (CI builds it into ../ffandroid)
                          "-DLUNASHARE_FFMPEG_ANDROID=${file("${rootDir}/../ffandroid").absolutePath}"
                cppFlags '-std=c++17'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // A fixed key, so a new version installs over the old one (and keeps settings, chats, playlists). Without one -
    // a fresh debug key on every build machine - Android refuses the update and the app has to be removed first.
    // CI: the secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD.
    def ks = System.getenv("LUNASHARE_KEYSTORE")
    signingConfigs {
        if (ks && file(ks).exists()) {
            fixed {
                storeFile file(ks)
                storePassword System.getenv("LUNASHARE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LUNASHARE_KEY_ALIAS")
                keyPassword System.getenv("LUNASHARE_KEY_PASSWORD") ?: System.getenv("LUNASHARE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig((ks && file(ks).exists()) ? signingConfigs.fixed : signingConfigs.debug)
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${sdlDir}/android-project/app/src/main/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1+'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
