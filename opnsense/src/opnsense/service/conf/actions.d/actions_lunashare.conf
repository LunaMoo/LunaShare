[start]
command:/usr/local/etc/rc.d/lunashare_rendezvous start
parameters:
type:script
message:starting LunaShare rendezvous

[stop]
command:/usr/local/etc/rc.d/lunashare_rendezvous stop
parameters:
type:script
message:stopping LunaShare rendezvous

[restart]
command:/usr/local/etc/rc.d/lunashare_rendezvous restart
parameters:
type:script
message:restarting LunaShare rendezvous

[status]
command:/usr/local/etc/rc.d/lunashare_rendezvous status; exit 0
parameters:
type:script_output
message:requesting LunaShare rendezvous status

[invited]
command:/usr/local/bin/lunashare-rendezvous -d /var/db/lunashare --list-invited --json
parameters:
type:script_output
message:listing people who joined with an invite

[release]
command:/usr/local/bin/lunashare-rendezvous -d /var/db/lunashare --release
parameters:%s
type:script_output
message:releasing an invited device

[restrict]
command:/usr/local/bin/lunashare-rendezvous -d /var/db/lunashare --restrict
parameters:%s
type:script_output
message:limiting an invited device again
